<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integrations — VICTORUS AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<style>
  .integration-card { padding: 20px; display: flex; align-items: center; gap: 16px; }
  .integration-icon { width: 46px; height: 46px; border-radius: 12px; background: rgba(56,189,248,0.12); color: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-area">
    <div id="topnav-root"></div>
    <div class="page-content">
      <div class="page-header"><div><h2>Integrations</h2><p>Connect the tools your AI agents work with.</p></div></div>
      <div class="grid-2" id="integrations-grid" style="grid-template-columns:repeat(2,1fr);">
        <div class="skeleton" style="height:90px;"></div>
        <div class="skeleton" style="height:90px;"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
const PROVIDER_EMOJI = { slack: '💬', github: '🐙', notion: '📝', google_drive: '📂', gmail: '✉️', stripe: '💳' };

(async () => {
  const user = await initDashboardShell('Integrations');
  if (!user) return;
  await loadIntegrations();
})();

async function loadIntegrations() {
  try {
    const items = await Api.listIntegrations();
    document.getElementById('integrations-grid').innerHTML = items.map(i => `
      <div class="glass-card integration-card">
        <div class="integration-icon">${PROVIDER_EMOJI[i.provider] || '🔌'}</div>
        <div style="flex:1;">
          <strong style="color:var(--text-heading);font-size:14.5px;display:block;">${escapeHtml(i.name)}</strong>
          <span style="font-size:12.5px;color:var(--text-muted);">${escapeHtml(i.description)}</span>
        </div>
        <button class="btn ${i.is_connected ? 'btn-outline' : 'btn-primary'} btn-sm" onclick="toggleIntegration('${i.provider}')">
          ${i.is_connected ? 'Disconnect' : 'Connect'}
        </button>
      </div>
    `).join('');
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function toggleIntegration(provider) {
  try {
    await Api.toggleIntegration(provider);
    await loadIntegrations();
  } catch (err) {
    toast(err.message, 'error');
  }
}
</script>
</body>
</html>
