<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — VeriSpire AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<style>
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .bar-label { width: 120px; font-size: 13px; color: var(--text-body); flex-shrink: 0; }
  .bar-track { flex: 1; height: 10px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--btn-gradient); border-radius: 999px; transition: width var(--t-slow) var(--ease); width: 0; }
  .bar-value { width: 34px; text-align: right; font-size: 12.5px; color: var(--text-muted); flex-shrink: 0; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-area">
    <div id="topnav-root"></div>
    <div class="page-content">
      <div class="page-header"><div><h2>Analytics</h2><p>How your AI workspace is being used.</p></div></div>

      <div class="grid-2">
        <div class="glass-card card">
          <div class="card-header"><h3>Tasks by Status</h3></div>
          <div id="tasks-chart"><div class="skeleton" style="height:120px;"></div></div>
        </div>
        <div class="glass-card card">
          <div class="card-header"><h3>Conversations by Agent</h3></div>
          <div id="agents-chart"><div class="skeleton" style="height:120px;"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
(async () => {
  const user = await initDashboardShell('Analytics');
  if (!user) return;

  try {
    const data = await Api.analytics();

    const taskEntries = Object.entries(data.tasks_by_status);
    const maxTask = Math.max(1, ...taskEntries.map(([, v]) => v));
    document.getElementById('tasks-chart').innerHTML = taskEntries.length
      ? taskEntries.map(([label, value]) => barRowHtml(label.replace('_', ' '), value, maxTask)).join('')
      : emptyChart('No task data yet');
    animateBars();

    const agentEntries = Object.entries(data.conversations_by_agent);
    const maxAgent = Math.max(1, ...agentEntries.map(([, v]) => v));
    document.getElementById('agents-chart').innerHTML = agentEntries.length
      ? agentEntries.map(([label, value]) => barRowHtml(label, value, maxAgent)).join('')
      : emptyChart('No conversations yet');
    animateBars();
  } catch (err) {
    toast(err.message, 'error');
  }
})();

function barRowHtml(label, value, max) {
  const pct = Math.round((value / max) * 100);
  return `
    <div class="bar-row">
      <div class="bar-label" style="text-transform:capitalize;">${escapeHtml(label)}</div>
      <div class="bar-track"><div class="bar-fill" data-pct="${pct}"></div></div>
      <div class="bar-value">${value}</div>
    </div>
  `;
}

function emptyChart(msg) {
  return `<div class="empty-state" style="padding:30px 10px;"><p>${msg}</p></div>`;
}

function animateBars() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill').forEach(el => { el.style.width = `${el.dataset.pct}%`; });
  });
}
</script>
</body>
</html>
