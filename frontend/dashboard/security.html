<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security — VeriSpire AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-area">
    <div id="topnav-root"></div>
    <div class="page-content">
      <div class="page-header">
        <div><h2>Security</h2><p>Review active sessions and devices signed into your account.</p></div>
        <button class="btn btn-danger" id="logout-all-btn">Log Out All Devices</button>
      </div>

      <div class="glass-card card" style="padding:0;">
        <table class="data-table">
          <thead><tr><th>Device</th><th>IP Address</th><th>Started</th><th></th></tr></thead>
          <tbody id="sessions-tbody"><tr><td colspan="4"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
        </table>
      </div>

      <div class="glass-card card">
        <div class="card-header"><h3>Change Password</h3></div>
        <p style="font-size:13px;color:var(--text-muted);">Manage this from the <a href="settings.html" class="text-accent" style="text-decoration:underline;">Settings page</a>.</p>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
(async () => {
  const user = await initDashboardShell('Security');
  if (!user) return;
  await loadSessions();
  document.getElementById('logout-all-btn').addEventListener('click', logoutAllDevices);
})();

async function loadSessions() {
  try {
    const sessions = await Api.listSessions();
    const tbody = document.getElementById('sessions-tbody');
    if (!sessions.length) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="icon-wrap">🛡️</div><h4>No active sessions</h4></div></td></tr>`;
      return;
    }
    tbody.innerHTML = sessions.map(s => `
      <tr>
        <td style="color:var(--text-heading);font-weight:600;">${escapeHtml(s.device || 'Unknown device')} ${s.is_current ? '<span class="badge badge-accent" style="margin-left:8px;">This device</span>' : ''}</td>
        <td>${escapeHtml(s.ip_address || '—')}</td>
        <td>${timeAgo(s.created_at)}</td>
        <td style="text-align:right;">${s.is_current ? '' : `<button class="btn btn-ghost btn-sm" style="color:var(--error)" onclick="revokeSession('${s.id}')">Revoke</button>`}</td>
      </tr>
    `).join('');
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function revokeSession(id) {
  try {
    await Api.revokeSession(id);
    toast('Session revoked', 'success');
    await loadSessions();
  } catch (err) { toast(err.message, 'error'); }
}

async function logoutAllDevices() {
  if (!confirm('Log out of all devices, including this one?')) return;
  try {
    await Api.logoutAll();
    Storage.clear();
    window.location.href = '/auth/login.html';
  } catch (err) { toast(err.message, 'error'); }
}
</script>
</body>
</html>
