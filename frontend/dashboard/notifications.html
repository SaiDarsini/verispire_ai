<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — VeriSpire AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<style>
  .notif-row { display: flex; gap: 14px; padding: 16px; border-radius: 12px; align-items: flex-start; transition: background var(--t-fast) var(--ease); }
  .notif-row:hover { background: rgba(255,255,255,0.03); }
  .notif-row.unread { background: rgba(34,197,94,0.05); }
  .notif-dot-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .notif-dot-icon.info { background: rgba(56,189,248,0.12); color: var(--accent-blue); }
  .notif-dot-icon.success { background: rgba(16,185,129,0.12); color: var(--success); }
  .notif-dot-icon.warning { background: rgba(245,158,11,0.12); color: var(--warning); }
  .notif-dot-icon.error { background: rgba(239,68,68,0.12); color: var(--error); }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-area">
    <div id="topnav-root"></div>
    <div class="page-content">
      <div class="page-header">
        <div><h2>Notifications</h2><p>Stay on top of what's happening in your workspace.</p></div>
        <button class="btn btn-outline" id="mark-all-btn">Mark all as read</button>
      </div>
      <div class="glass-card card" id="notif-list">
        <div class="skeleton" style="height:60px;margin-bottom:10px;"></div>
        <div class="skeleton" style="height:60px;margin-bottom:10px;"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
const ICON = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '⛔' };

(async () => {
  const user = await initDashboardShell('Notifications');
  if (!user) return;
  await loadNotifications();
  document.getElementById('mark-all-btn').addEventListener('click', markAllRead);
})();

async function loadNotifications() {
  try {
    const items = await Api.listNotifications();
    const list = document.getElementById('notif-list');
    if (!items.length) {
      list.innerHTML = `<div class="empty-state"><div class="icon-wrap">🔔</div><h4>You're all caught up</h4><p>New notifications will show up here.</p></div>`;
      return;
    }
    list.innerHTML = items.map(n => `
      <div class="notif-row ${n.is_read ? '' : 'unread'}" data-id="${n.id}">
        <div class="notif-dot-icon ${n.type}">${ICON[n.type] || 'ℹ️'}</div>
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;gap:10px;">
            <strong style="color:var(--text-heading);font-size:13.5px;">${escapeHtml(n.title)}</strong>
            <span style="color:var(--text-muted);font-size:11.5px;white-space:nowrap;">${timeAgo(n.created_at)}</span>
          </div>
          <p style="font-size:13px;color:var(--text-muted);margin-top:4px;">${escapeHtml(n.message)}</p>
        </div>
        <div style="display:flex;gap:6px;">
          ${!n.is_read ? `<button class="btn btn-ghost btn-sm mark-read-btn" data-id="${n.id}">Mark read</button>` : ''}
          <button class="btn btn-ghost btn-sm" style="color:var(--error)" onclick="deleteNotif('${n.id}')">✕</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.mark-read-btn').forEach(btn => {
      btn.addEventListener('click', () => markRead(btn.dataset.id));
    });
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function markRead(id) {
  try { await Api.markRead(id); await loadNotifications(); } catch (err) { toast(err.message, 'error'); }
}

async function markAllRead() {
  try { await Api.markAllRead(); toast('All marked as read', 'success'); await loadNotifications(); }
  catch (err) { toast(err.message, 'error'); }
}

async function deleteNotif(id) {
  try { await Api.deleteNotification(id); await loadNotifications(); } catch (err) { toast(err.message, 'error'); }
}
</script>
</body>
</html>
