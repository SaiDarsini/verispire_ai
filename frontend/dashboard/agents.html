<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agents — VeriSpire AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<style>
  .agent-card { padding: 22px; display: flex; flex-direction: column; }
  .agent-card .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .agent-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(34,197,94,0.12); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .switch { width: 42px; height: 24px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; transition: background var(--t-fast) var(--ease); flex-shrink: 0; }
  .switch.on { background: var(--accent); }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform var(--t-fast) var(--ease); }
  .switch.on::after { transform: translateX(18px); }
  .agents-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-area">
    <div id="topnav-root"></div>
    <div class="page-content">
      <div class="page-header">
        <div><h2>Verification Agents</h2><p>Enable the specialist verifiers you want in this workspace.</p></div>
      </div>
      <div class="agents-grid" id="agents-grid">
        <div class="skeleton" style="height:150px;"></div>
        <div class="skeleton" style="height:150px;"></div>
        <div class="skeleton" style="height:150px;"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
const AGENT_EMOJI = { personal: '✨', logic_math: '∑', hallucination_auditor: '🔎', sandbox_security: '🛡️', architectural_planner: '🗺️', rejection_watchdog: '⛔' };

(async () => {
  const user = await initDashboardShell('Agents');
  if (!user) return;
  await loadAgents();
})();

async function loadAgents() {
  try {
    const agents = await Api.listAgents();
    const grid = document.getElementById('agents-grid');
    if (!agents.length) {
      grid.innerHTML = `<div class="empty-state"><div class="icon-wrap">🤖</div><h4>No agents available</h4><p>Run the seed script to populate the agent catalog.</p></div>`;
      return;
    }
    grid.innerHTML = agents.map(a => `
      <div class="glass-card agent-card">
        <div class="top">
          <div class="agent-icon">${AGENT_EMOJI[a.key] || '🤖'}</div>
          <div class="switch ${a.is_enabled ? 'on' : ''}" data-key="${a.key}" data-enabled="${a.is_enabled}"></div>
        </div>
        <h4 style="font-size:15.5px;color:var(--text-heading);margin-bottom:6px;">${escapeHtml(a.name)}</h4>
        <p style="font-size:13px;color:var(--text-muted);flex:1;margin-bottom:14px;">${escapeHtml(a.description)}</p>
        <a href="conversations.html?agent=${encodeURIComponent(a.key)}" class="btn btn-outline btn-sm btn-block">Verify with ${escapeHtml(a.name.split(' ')[0])}</a>
      </div>
    `).join('');

    grid.querySelectorAll('.switch').forEach(sw => {
      sw.addEventListener('click', async () => {
        const key = sw.dataset.key;
        const newState = sw.dataset.enabled !== 'true';
        sw.classList.toggle('on', newState);
        sw.dataset.enabled = newState;
        try {
          await Api.toggleAgent(key, newState);
          toast(`${newState ? 'Enabled' : 'Disabled'} agent`, 'success');
        } catch (err) {
          sw.classList.toggle('on', !newState);
          sw.dataset.enabled = !newState;
          toast(err.message, 'error');
        }
      });
    });
  } catch (err) {
    toast(err.message, 'error');
  }
}
</script>
</body>
</html>
